<title>Shade Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;600&family=Kalam&display=swap">
<style>
:root{
  --paper:#FBF9F6;--panel:#FFFFFF;--sunk:#F3F0EA;--line:#E2DCD1;--line2:#CFC7B8;
  --ink:#1B1E26;--ink2:#55596B;--ink3:#80859A;
  --accent:#C9571A;--accent-ink:#FFFFFF;--accent-soft:#FBEDE4;
  --crit:#A7332A;--crit-soft:#FAEAE7;--crit-line:#E3ABA3;
  --warn:#8A5606;--warn-soft:#FBF1DC;--warn-line:#E6C88C;
  --ok:#137F5C;--ok-soft:#E6F2EC;--ok-line:#A9D6C2;
  --c1:#137F5C;
  --font-d:'Archivo',system-ui,sans-serif;
  --font-b:'Source Sans 3','Noto Sans Devanagari',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#12161F;--panel:#191E2A;--sunk:#10141C;--line:#2B3140;--line2:#3C4356;
  --ink:#EEEAE2;--ink2:#A9AFC0;--ink3:#7A8094;
  --accent:#F08544;--accent-ink:#1A1206;--accent-soft:#2A1D14;
  --crit:#EC8A82;--crit-soft:#2B1714;--crit-line:#5E2F29;
  --warn:#E3B45E;--warn-soft:#2A2213;--warn-line:#5C4722;
  --ok:#3DB287;--ok-soft:#10241C;--ok-line:#1F4A39;
  --c1:#2E9E74;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#12161F;--panel:#191E2A;--sunk:#10141C;--line:#2B3140;--line2:#3C4356;
  --ink:#EEEAE2;--ink2:#A9AFC0;--ink3:#7A8094;
  --accent:#F08544;--accent-ink:#1A1206;--accent-soft:#2A1D14;
  --crit:#EC8A82;--crit-soft:#2B1714;--crit-line:#5E2F29;
  --warn:#E3B45E;--warn-soft:#2A2213;--warn-line:#5C4722;
  --ok:#3DB287;--ok-soft:#10241C;--ok-line:#1F4A39;
  --c1:#2E9E74;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:19px}h2{font-size:17px}h3{font-size:14.5px}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand small{display:block;font-size:12px;color:var(--ink3);font-weight:400;letter-spacing:0;font-family:var(--font-b)}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;font-family:var(--font-d);font-weight:500;font-size:14px;color:var(--ink3);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink3)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-p:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn-s{padding:5px 10px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--ink2);max-width:68ch;font-size:14.5px}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split.l{grid-template-columns:minmax(0,340px) minmax(0,1fr)}
@media (max-width:860px){.split,.split.l{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:16px}
.card-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--sunk)}
.stack{display:flex;flex-direction:column;gap:12px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.tag.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.tag.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* steps */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.step:hover{border-color:var(--line2)}
.step[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.step .n{font-family:var(--font-m);font-size:12px;width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink2)}
.step[aria-pressed="true"] .n{background:var(--accent);color:var(--accent-ink)}
.step b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.step small{display:block;font-size:12px;color:var(--ink3)}

/* document */
.docframe{background:var(--sunk);padding:14px;display:flex;justify-content:center}
.docframe canvas,.docframe img{width:100%;max-width:520px;height:auto;display:block;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.08)}

/* review */
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.points li{display:flex;gap:10px;font-size:14.5px}
.points .k{font-family:var(--font-m);font-size:12px;color:var(--accent);flex:none;padding-top:2px}
.status{font-size:13px;color:var(--ink2);border-left:3px solid var(--line2);border-radius:0;padding:2px 0 2px 10px}
.status.on{border-left-color:var(--ok)}
.errbox{font-size:13.5px;background:var(--crit-soft);border:1px solid var(--crit-line);color:var(--ink);border-radius:8px;padding:9px 12px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.frow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow label{font-size:13px;color:var(--ink2)}
.frow input,.frow textarea{width:100%;min-width:0;font-family:var(--font-m);font-size:13px;line-height:1.5;padding:7px 9px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);resize:vertical}
.frow.low input,.frow.low textarea{border-color:var(--warn-line);background:var(--warn-soft)}
.frow .act{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:520px){.frow{grid-template-columns:minmax(0,1fr)}.frow .act{grid-column:1}}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.chk .ic{font-family:var(--font-m);font-weight:600;flex:none;width:18px;text-align:center}
.chk.ok{background:var(--ok-soft);border-color:var(--ok-line)}.chk.ok .ic{color:var(--ok)}
.chk.warn{background:var(--warn-soft);border-color:var(--warn-line)}.chk.warn .ic{color:var(--warn)}
.chk.err{background:var(--crit-soft);border-color:var(--crit-line)}.chk.err .ic{color:var(--crit)}
.chk .body{flex:1;min-width:0}
.chk .fix{margin-top:6px}
.savedbox{background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:10px;padding:14px 16px}
.counts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13.5px;color:var(--ink2);margin-top:16px}
.counts b{font-family:var(--font-d);font-size:17px;color:var(--ink);margin-right:5px}

/* lists & tables */
.search{width:100%;font:inherit;font-size:14px;padding:8px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 16px;cursor:pointer}
.row:hover{background:var(--sunk)}
.row[aria-pressed="true"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.row .t1{font-weight:600;font-size:14px}
.row .t2{font-size:12.5px;color:var(--ink3)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--sunk)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kv div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.kv .v{font-family:var(--font-m);font-size:14px;margin-top:2px}
.lead{font-size:15px;padding:11px 13px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.meter{height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--c1);border-radius:0 3px 3px 0}

/* trace */
.gen{display:flex;flex-direction:column;gap:0}
.node{position:relative;padding:10px 0 12px 22px;border-left:2px solid var(--line2);margin-left:7px}
.node:last-child{border-left-color:transparent}
.node::before{content:"";position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--line2)}
.node.hot::before{border-color:var(--crit);background:var(--crit)}
.node .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.lotbtns{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.lotbtn{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:13.5px}
.lotbtn:hover{border-color:var(--line2)}
.lotbtn[aria-pressed="true"]{border-color:var(--crit);background:var(--crit-soft)}
.radius{border:1px solid var(--crit-line);background:var(--crit-soft);border-radius:10px;padding:14px 16px}
.big{font-family:var(--font-d);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}

/* certificate */
.cert{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:22px 22px 18px}
.cert .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.cert .wm span{transform:rotate(-22deg);font-family:var(--font-d);font-weight:600;font-size:54px;letter-spacing:.12em;color:var(--ink);opacity:.06;white-space:nowrap}
.cert-h{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
.cert-h .co{font-family:var(--font-d);font-size:17px;font-weight:600}
.cert-h .ti{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);margin-top:4px}
.crow{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.crow .k{color:var(--ink2)}
.prov{background:none;border:0;padding:0 0 1px;font-family:var(--font-m);font-size:13px;color:var(--ink);border-bottom:1px dotted var(--accent);cursor:pointer;text-align:right}
.prov:hover,.prov[aria-expanded="true"]{color:var(--accent)}
.provbox{margin-top:12px;background:var(--sunk);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0;padding:10px 12px;font-size:13px}
.blockd{background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:8px;padding:11px 13px;font-size:13.5px;margin-bottom:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;z-index:20;box-shadow:0 6px 22px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.foot{max-width:1180px;margin:0 auto;padding:0 16px 32px;font-size:12px;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="root"></div>

/* ================= helpers ================= */
const num = s => { const m = String(s??'').replace(/,/g,'').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
const kgs = n => (Math.round(n*10)/10).toLocaleString('en-IN',{maximumFractionDigits:1});
const norm = s => String(s||'').toLowerCase().replace(/[\s._-]/g,'');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dm = s => String(s||'').match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
const fdate = s => { const m = dm(s); if(!m) return s||''; const y = m[3].length===2?'20'+m[3]:m[3]; return `${+m[1]} ${MON[+m[2]-1]||m[2]} ${y}`; };
const dkey = s => { const m = dm(s); if(!m) return 0; const y = m[3].length===2?2000+ +m[3]:+m[3]; return y*10000+(+m[2])*100+(+m[1]); };
function parseLots(s){ const out=[]; const re=/([A-Za-z0-9]+(?:-[A-Za-z0-9]+)+)\s*[:=–-]?\s*(\d[\d,]*(?:\.\d+)?)\s*kg/gi; let m; while((m=re.exec(String(s||'')))){ out.push({lot:m[1].toUpperCase(),kg:parseFloat(m[2].replace(/,/g,''))}); } return out; }
function parseRecipe(s){ return String(s||'').split(/[,;\n]+/).map(p=>{ const m=p.trim().match(/^(.+?)\s*([\d.]+)\s*%$/); return m?{comp:m[1].trim(),pct:parseFloat(m[2])}:null; }).filter(Boolean); }
function lev(a,b){ const d=[]; for(let i=0;i<=a.length;i++){d[i]=[i];} for(let j=1;j<=b.length;j++) d[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
function closestLot(st,id){ let best=null,bd=9; for(const k of Object.keys(st.lots)){ const d=lev(k,id); if(d<bd){bd=d;best=k;} } return bd<=2?best:null; }
function compFor(material){ const m=String(material).toLowerCase();
  if(m.includes('blue 15')) return 'PB15:3'; if(m.includes('yellow 83')) return 'PY83'; if(m.includes('red 57')) return 'PR57:1';
  if(m.includes('carbon black')) return 'CB N330'; if(m.includes('titanium')||m.includes('tio2')) return 'TiO2'; if(m.includes('wax')) return 'PE wax';
  if(m.includes('lldpe')||m.includes('homopolymer')||m.includes('carrier')||m.includes('polypropylene')) return 'carrier'; return material; }
const usedOf = (st,lotId) => Object.values(st.batches).reduce((a,b)=>a+b.lots.filter(l=>l.lot===lotId).reduce((x,l)=>x+l.kg,0),0);
const shippedOf = (st,bId) => Object.values(st.dispatches).filter(d=>d.batch===bId).reduce((a,d)=>a+d.qty,0);
const charged = b => b.lots.reduce((a,l)=>a+l.kg,0);
function adherence(st,batch){
  const shade=st.shades[batch.shade]; if(!shade) return null; const T0=charged(batch); if(!T0) return null;
  const by={}; for(const l of batch.lots){ const lot=st.lots[l.lot]; if(!lot) return null; const k=norm(lot.comp); by[k]=(by[k]||0)+l.kg; }
  const rows=shade.recipe.map(r=>{ const exp=T0*r.pct/100, act=by[norm(r.comp)]||0; delete by[norm(r.comp)]; return {comp:r.comp,exp,act,dev:exp?(act-exp)/exp*100:0}; });
  const ps=shade.recipe.reduce((a,r)=>a+r.pct,0), cexp=T0*(100-ps)/100, cact=by['carrier']||0; delete by['carrier'];
  rows.push({comp:'Carrier',exp:cexp,act:cact,dev:cexp?(cact-cexp)/cexp*100:0});
  for(const k of Object.keys(by)) rows.push({comp:k,exp:0,act:by[k],dev:null,extra:true});
  const worst=Math.max(...rows.map(r=>r.extra?999:Math.abs(r.dev)));
  return {rows,worst};
}
const SRCNAME = {inward:'Inward register',labdip:'Lab dip sheet',batchlog:'Batch log sheet',qc:'QC register',dispatch:'Dispatch slip'};
function provText(src){
  if(!src) return 'No source on record.';
  const n=SRCNAME[src.type]||'Record';
  if(src.mode==='seed') return `${n}. Sample record loaded with the demo.`;
  const when = src.at ? new Date(src.at).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  return `${n}, photographed ${when}. ${src.mode==='live'?'Read live by Claude':'Prepared reading'}, then confirmed by a person on the floor.`;
}

/* ================= checks (plain logic, no AI) ================= */
function runChecks(type,v,st,lang){
  const out=[]; const E=(en,hi,fix)=>out.push({level:'err',text:msg(lang,en,hi),fix}); const W=(en,hi)=>out.push({level:'warn',text:msg(lang,en,hi)}); const K=(en,hi)=>out.push({level:'ok',text:msg(lang,en,hi)});
  if(type==='inward'){
    const lot=String(v.lot||'').trim().toUpperCase(), q=num(v.qty);
    if(!lot) E('Lot number is missing.','लॉट नंबर नहीं मिला।');
    else if(st.lots[lot]) E(`Lot ${lot} is already in the inward register.`,`लॉट ${lot} पहले से आवक रजिस्टर में है।`);
    if(isNaN(q)) E('Net weight is not a number.','शुद्ध वज़न संख्या नहीं है।');
    if(!String(v.coa||'').trim()) W('No CoA value recorded. Ask the supplier for the test certificate.','CoA की कोई वैल्यू नहीं है। सप्लायर से टेस्ट सर्टिफिकेट मांगें।');
    if(lot && !st.lots[lot] && !isNaN(q)) K(`New lot ${lot}: ${kgs(q)} kg of ${v.material}.`,`नया लॉट ${lot}: ${v.material} का ${kgs(q)} kg।`);
  }
  if(type==='labdip'){
    const code=String(v.shade||'').trim().toUpperCase(), de=num(v.de), rec=parseRecipe(v.recipe), tot=rec.reduce((a,r)=>a+r.pct,0);
    if(!code) E('Shade code is missing.','शेड कोड नहीं मिला।');
    if(isNaN(de)) E('ΔE is not a number.','ΔE संख्या नहीं है।');
    if(!rec.length) E('Could not read the recipe components.','रेसिपी के हिस्से पढ़े नहीं जा सके।');
    else if(tot>=100) E('Recipe adds up to 100% or more, leaving no room for carrier.','रेसिपी 100% या उससे ज़्यादा है, कैरियर के लिए जगह नहीं।');
    if(code && st.shades[code]) W(`This replaces the recipe of record for ${code}.`,`यह ${code} की रिकॉर्ड रेसिपी को बदल देगा।`);
    if(/approv/i.test(v.result) && de>1.0) W(`Marked approved with ΔE ${de}, above the usual 1.0 limit.`,`ΔE ${de} पर मंज़ूर, जो सामान्य 1.0 सीमा से ऊपर है।`);
    if(code && rec.length && tot<100 && !isNaN(de)) K(`Recipe of record: ${rec.length} components plus carrier, let-down ${v.ldr}.`,`रिकॉर्ड रेसिपी: ${rec.length} हिस्से और कैरियर, लेट-डाउन ${v.ldr}।`);
  }
  if(type==='batchlog'){
    const id=String(v.batch||'').trim().toUpperCase(), sh=String(v.shade||'').trim().toUpperCase(), lots=parseLots(v.lots), outKg=num(v.output), pg=num(v.purge);
    if(!id) E('Batch number is missing.','बैच नंबर नहीं मिला।'); else if(st.batches[id]) E(`Batch ${id} is already in the record.`,`बैच ${id} पहले से रिकॉर्ड में है।`);
    if(!st.shades[sh]) E(`Shade ${sh||'(blank)'} has no recipe of record. Capture its lab dip sheet first.`,`शेड ${sh||'(खाली)'} की कोई रिकॉर्ड रेसिपी नहीं है। पहले उसकी लैब डिप शीट दर्ज करें।`);
    if(!lots.length) E('Could not read the lots charged.','चार्ज किए गए लॉट पढ़े नहीं जा सके।');
    let allFound=true;
    for(const l of lots){
      const lot=st.lots[l.lot];
      if(!lot){ allFound=false; const c=closestLot(st,l.lot);
        E(`Lot ${l.lot} is not in the inward register.${c?` The closest lot on record is ${c}.`:''}`,`लॉट ${l.lot} आवक रजिस्टर में नहीं है।${c?` रिकॉर्ड में सबसे मिलता लॉट ${c} है।`:''}`,
          c?{label:msg(lang,`Use ${c}`,`${c} लें`),patch:{lots:String(v.lots).replace(new RegExp(l.lot.replace(/[-]/g,'\\-'),'i'),c)}}:null);
      } else { const rem=lot.qty-usedOf(st,l.lot); if(l.kg>rem+0.01) E(`Lot ${l.lot} has only ${kgs(rem)} kg left.`,`लॉट ${l.lot} में सिर्फ़ ${kgs(rem)} kg बचा है।`); }
    }
    if(lots.length && !isNaN(outKg) && !isNaN(pg)){
      const tin=lots.reduce((a,l)=>a+l.kg,0), acc=outKg+pg, d=Math.abs(tin-acc);
      if(d<=0.5) K(`Balance closes: ${kgs(tin)} kg charged, ${kgs(acc)} kg accounted for.`,`हिसाब बराबर: ${kgs(tin)} kg चार्ज, ${kgs(acc)} kg का हिसाब।`);
      else W(`Balance is off by ${kgs(d)} kg: ${kgs(tin)} kg charged, ${kgs(acc)} kg accounted for.`,`हिसाब ${kgs(d)} kg से गड़बड़: ${kgs(tin)} kg चार्ज, ${kgs(acc)} kg का हिसाब।`);
      if(tin>0 && pg/tin>0.03) W(`Purge loss ${(pg/tin*100).toFixed(1)}% is above the 3% norm.`,`पर्ज नुकसान ${(pg/tin*100).toFixed(1)}% है, 3% सीमा से ज़्यादा।`);
    } else E('Output or purge is not a number.','उत्पादन या पर्ज संख्या नहीं है।');
    if(lots.length && st.shades[sh]){
      if(!allFound) out.push({level:'warn',text:msg(lang,'Recipe check waits until every lot is matched.','सभी लॉट मिलने के बाद रेसिपी जांच होगी।')});
      else { const a=adherence(st,{shade:sh,lots}); if(a){ const off=a.rows.filter(r=>r.extra||Math.abs(r.dev)>5);
        if(!off.length) K(`Charge matches the recipe of record for ${sh}, every component within 5%.`,`चार्ज ${sh} की रिकॉर्ड रेसिपी से मेल खाता है, हर हिस्सा 5% के अंदर।`);
        off.forEach(r=>W(r.extra?`${r.comp} is not in the recipe for ${sh}.`:`${r.comp}: ${kgs(r.act)} kg charged against ${kgs(r.exp)} kg in the recipe (${r.dev>0?'+':''}${r.dev.toFixed(1)}%).`,
                         r.extra?`${r.comp} ${sh} की रेसिपी में नहीं है।`:`${r.comp}: रेसिपी में ${kgs(r.exp)} kg, चार्ज ${kgs(r.act)} kg (${r.dev>0?'+':''}${r.dev.toFixed(1)}%)।`)); } }
    }
  }
  if(type==='qc'){
    const id=String(v.batch||'').trim().toUpperCase(), b=st.batches[id], de=num(v.de);
    if(!id) E('Batch number is missing.','बैच नंबर नहीं मिला।');
    else if(!b) E(`Batch ${id} is not in the record yet. Capture its batch log first.`,`बैच ${id} अभी रिकॉर्ड में नहीं है। पहले उसका बैच लॉग दर्ज करें।`);
    if(isNaN(de)) E('ΔE is not a number.','ΔE संख्या नहीं है।');
    if(b && b.qc) W('This replaces the QC reading already on record.','यह रिकॉर्ड में मौजूद QC रीडिंग को बदल देगा।');
    if(!isNaN(de) && de>1.0 && /pass/i.test(v.result)) W(`ΔE ${de} is above 1.0 but marked pass.`,`ΔE ${de}, 1.0 से ऊपर है लेकिन पास लिखा है।`);
    if(b && !isNaN(de)){ const s=st.shades[b.shade]; if(s) K(`ΔE ${de} for this batch; ${s.code} was approved at ΔE ${s.de}.`,`इस बैच का ΔE ${de}; ${s.code} की मंज़ूरी ΔE ${s.de} पर हुई थी।`); }
  }
  if(type==='dispatch'){
    const dn=String(v.dn||'').trim().toUpperCase(), id=String(v.batch||'').trim().toUpperCase(), b=st.batches[id], sh=String(v.shade||'').trim().toUpperCase(), q=num(v.qty);
    if(!dn) E('Dispatch note number is missing.','डिस्पैच नोट नंबर नहीं मिला।'); else if(st.dispatches[dn]) E(`${dn} is already in the record.`,`${dn} पहले से रिकॉर्ड में है।`);
    if(!b) E(`Batch ${id||'(blank)'} is not in the record yet. Capture its batch log first.`,`बैच ${id||'(खाली)'} अभी रिकॉर्ड में नहीं है। पहले उसका बैच लॉग दर्ज करें।`);
    if(isNaN(q)) E('Quantity is not a number.','मात्रा संख्या नहीं है।');
    if(b){
      if(b.shade!==sh) E(`Batch ${id} is shade ${b.shade}, not ${sh}.`,`बैच ${id} शेड ${b.shade} का है, ${sh} का नहीं।`);
      const avail=b.output-shippedOf(st,id); if(!isNaN(q) && q>avail+0.01) E(`Only ${kgs(avail)} kg of batch ${id} is left to dispatch.`,`बैच ${id} में भेजने को सिर्फ़ ${kgs(avail)} kg बचा है।`);
      if(!b.qc) W('This batch has no QC reading on record, so no certificate can be issued for it yet.','इस बैच की कोई QC रीडिंग नहीं है, इसलिए अभी प्रमाणपत्र नहीं बन सकता।');
      const s=st.shades[b.shade]; if(s && !s.catalogue && s.customer && norm(s.customer)!==norm(v.customer)) W(`Shade ${s.code} was matched for ${s.customer}.`,`शेड ${s.code} ${s.customer} के लिए बनाया गया था।`);
      if(b.shade===sh && !isNaN(q) && q<=avail+0.01) K(`${kgs(q)} kg of ${sh} to ${v.customer}.`,`${v.customer} को ${sh} का ${kgs(q)} kg।`);
    }
  }
  return out;
}

/* ================= commit to the record ================= */
function commit(type,v,st,mode){
  const n=clone(st); const src={type,mode,at:new Date().toISOString()};
  if(type==='inward'){ const id=String(v.lot).trim().toUpperCase(); n.lots[id]={id,material:v.material,comp:compFor(v.material),supplier:v.supplier,qty:num(v.qty),date:v.date,coa:v.coa,src}; return {n,id}; }
  if(type==='labdip'){ const id=String(v.shade).trim().toUpperCase(); n.shades[id]={code:id,name:v.name,customer:v.customer,catalogue:false,carrier:v.carrier,recipe:parseRecipe(v.recipe),ldr:v.ldr,de:num(v.de),result:v.result,date:new Date().toLocaleDateString('en-GB'),src}; return {n,id}; }
  if(type==='batchlog'){ const id=String(v.batch).trim().toUpperCase(); n.batches[id]={id,line:v.line,shade:String(v.shade).trim().toUpperCase(),date:v.date,lots:parseLots(v.lots),output:num(v.output),purge:num(v.purge),qc:null,src}; return {n,id:n.batches[id].shade,batch:id}; }
  if(type==='qc'){ const id=String(v.batch).trim().toUpperCase(); n.batches[id].qc={de:num(v.de),mfi:v.mfi,dispersion:v.dispersion,moisture:v.moisture,result:v.result,date:new Date().toLocaleDateString('en-GB'),src}; return {n,id}; }
  if(type==='dispatch'){ const id=String(v.dn).trim().toUpperCase(); n.dispatches[id]={dn:id,customer:v.customer,shade:String(v.shade).trim().toUpperCase(),batch:String(v.batch).trim().toUpperCase(),qty:num(v.qty),date:v.date,src}; return {n,id}; }
}
const GOTAB = {inward:'material',labdip:'shades',batchlog:'shades',qc:'certs',dispatch:'trace'};

/* ================= drawing the paper sheet ================= */
function fitText(c,txt,x,y,maxW){ let s=30; do{ c.font=`${s}px "Kalam","Comic Sans MS",cursive`; if(c.measureText(txt).width<=maxW) break; s-=2; }while(s>18); c.fillText(txt,x,y); }
async function drawDoc(cv,p){
  const W=820, top=150, rh=62, H=top+p.rows.length*rh+54; cv.width=W; cv.height=H;
  try{ await Promise.all([document.fonts.load('30px "Kalam"'),document.fonts.load('30px "Kalam"','रंग'),document.fonts.load('600 28px "Archivo"'),document.fonts.load('17px "Source Sans 3"')]); }catch(e){}
  const c=cv.getContext('2d'); c.textAlign='left';
  c.fillStyle='#F5F0E4'; c.fillRect(0,0,W,H);
  c.fillStyle='#262320'; c.font='600 28px "Archivo",Arial,sans-serif'; c.fillText(p.title,44,66);
  c.fillStyle='#766C5F'; c.font='17px "Source Sans 3",Arial,sans-serif'; c.fillText(p.form,44,96);
  c.strokeStyle='#262320'; c.lineWidth=2; c.beginPath(); c.moveTo(44,116); c.lineTo(W-44,116); c.stroke();
  c.strokeStyle='rgba(185,70,60,0.35)'; c.lineWidth=1.5; c.beginPath(); c.moveTo(262,122); c.lineTo(262,H-20); c.stroke();
  p.rows.forEach((r,i)=>{
    const yb=top+i*rh, base=yb+38;
    c.strokeStyle='rgba(70,100,150,0.20)'; c.lineWidth=1; c.beginPath(); c.moveTo(44,yb+rh-8); c.lineTo(W-44,yb+rh-8); c.stroke();
    if(r[0]){ c.fillStyle='#766C5F'; c.font='17px "Source Sans 3",Arial,sans-serif'; c.fillText(r[0],44,base); }
    const o=r[2]||{}; let x=282; c.fillStyle='#1F3B7A';
    if(o.strike){ c.font='28px "Kalam","Comic Sans MS",cursive'; c.fillText(o.strike,x,base); const w=c.measureText(o.strike).width; c.strokeStyle='#1F3B7A'; c.lineWidth=2.5; c.beginPath(); c.moveTo(x-4,base-8); c.lineTo(x+w+4,base-14); c.stroke(); x+=w+26; c.fillStyle='#1F3B7A'; }
    if(r[1]) fitText(c,r[1],x,base,W-44-x);
    if(o.smudge){ c.fillStyle='rgba(90,80,70,0.14)'; c.beginPath(); c.ellipse(x+74,base-10,66,17,-0.08,0,Math.PI*2); c.fill(); }
    if(o.stamp){ c.save(); c.translate(x+118,base-10); c.rotate(-0.12); c.strokeStyle='rgba(178,34,34,0.78)'; c.lineWidth=3; c.strokeRect(-104,-26,208,50); c.fillStyle='rgba(178,34,34,0.82)'; c.font='600 27px "Archivo",Arial,sans-serif'; c.textAlign='center'; c.fillText(o.stamp,0,9); c.restore(); c.textAlign='left'; }
    if(o.sign){ c.strokeStyle='#1F3B7A'; c.lineWidth=2; c.beginPath(); c.moveTo(x,base-4); c.bezierCurveTo(x+30,base-34,x+48,base+10,x+78,base-12); c.bezierCurveTo(x+100,base-30,x+112,base+2,x+150,base-8); c.stroke(); }
  });
}
const canvasBlob = cv => new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej({code:'image_rejected'}),'image/jpeg',0.92));

/* ================= asking Claude to read a photo ================= */
function buildPrompt(doc){
  const lines=doc.fields.map(f=>`- ${f.key}: ${f.en}${f.hint?` (${f.hint})`:''}`).join('\n');
  return `The image is a photograph of a paper "${doc.en}" from a masterbatch (plastic colour concentrate) factory in India. It may be printed, handwritten, or both, and may include Hindi, Gujarati or Marathi.

Read these fields:
${lines}

Rules:
- Copy each value exactly as written. Do not correct spelling, complete numbers, or guess.
- If a value is struck out and rewritten, use the rewritten value.
- If a field is smudged, faint, or you are not sure of every character, still give your best reading but set confidence to "low". Use "" only if nothing is written.
- Never invent a lot number, weight or test reading.

Reply with only this JSON:
{"fields":[{"key":"<key>","value":"<text>","confidence":"high" or "low"}],"note":"<one short sentence on anything unclear, or empty>"}`;
}
function normalize(doc,out){
  const arr=Array.isArray(out&&out.fields)?out.fields:[];
  return doc.fields.map(f=>{ const h=arr.find(x=>x&&String(x.key)===f.key); const value=h&&h.value!=null?String(h.value).trim():''; const conf=h&&h.confidence==='high'&&value?'high':'low'; return {key:f.key,value,conf,confirmed:conf==='high'}; });
}
function useSampler(){
  const [s,setS]=useState({ready:false,fn:null,images:false,types:[]});
  useEffect(()=>{ let on=true; (async()=>{ try{
      const c=window.claude; const fn=c&&typeof c.use==='function'?await c.use('sample'):null;
      if(!fn){ on&&setS({ready:true,fn:null,images:false,types:[]}); return; }
      const caps=await fn.limits().catch(()=>null);
      on&&setS({ready:true,fn,images:!!(caps&&caps.images),types:(caps&&caps.images&&caps.images.mediaTypes)||[]});
    }catch(e){ on&&setS({ready:true,fn:null,images:false,types:[]}); } })(); return ()=>{on=false;}; },[]);
  return [s,setS];
}
const ERRS = {
  rate_limited:['Too many reads just now. Try again in a minute, or use the prepared reading.','अभी बहुत ज़्यादा रीडिंग हो गई। एक मिनट बाद फिर कोशिश करें, या तैयार रीडिंग लें।'],
  session_expired:['Sign in to Claude again to read photos.','फोटो पढ़ने के लिए Claude में फिर से साइन इन करें।'],
  image_rejected:['That photo could not be used. Try a JPEG or PNG under 20 MB.','यह फोटो इस्तेमाल नहीं हो सकी। 20 MB से छोटी JPEG या PNG लें।'],
  refused:['Claude declined to read this image. Try a different photo.','Claude ने यह फोटो नहीं पढ़ी। दूसरी फोटो लें।'],
  invalid_json:['The reading came back incomplete. Try again, or use the prepared reading.','रीडिंग अधूरी आई। फिर कोशिश करें, या तैयार रीडिंग लें।'],
  empty_completion:['The reading came back empty. Try again, or use the prepared reading.','रीडिंग खाली आई। फिर कोशिश करें, या तैयार रीडिंग लें।']
};
const HIDE = ['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'];

/* ================= Capture ================= */
function Capture({st,setSt,go,sampler,setSampler,lang,setLang,toast}){
  const t=T[lang];
  const [type,setType]=useState('batchlog');
  const [photo,setPhoto]=useState(null);
  const [phase,setPhase]=useState('idle');
  const [fields,setFields]=useState(null);
  const [source,setSource]=useState(null);
  const [note,setNote]=useState('');
  const [err,setErr]=useState('');
  const [saved,setSaved]=useState(null);
  const cvRef=useRef(null), ctlRef=useRef(null), fileRef=useRef(null);
  const doc=DOCS[type];
  const live=!!(sampler.fn&&sampler.images);

  useEffect(()=>{ if(!photo&&cvRef.current) drawDoc(cvRef.current,doc.paper); },[type,photo]);
  useEffect(()=>()=>{ ctlRef.current&&ctlRef.current.abort(); },[]);

  function clear(next){ ctlRef.current&&ctlRef.current.abort(); setPhase('idle'); setFields(null); setSource(null); setNote(''); setErr(''); setSaved(null);
    if(photo){ URL.revokeObjectURL(photo.url); setPhoto(null); } if(next) setType(next); }
  function pickPhoto(e){ const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return; if(photo) URL.revokeObjectURL(photo.url);
    setPhoto({file:f,url:URL.createObjectURL(f)}); setPhase('idle'); setFields(null); setErr(''); setSaved(null); }
  async function readLive(){
    setErr(''); setPhase('reading'); const ctl=new AbortController(); ctlRef.current=ctl;
    try{
      const blob=photo?photo.file:await canvasBlob(cvRef.current);
      const out=await sampler.fn.json(buildPrompt(doc),{images:blob,signal:ctl.signal});
      setFields(normalize(doc,out)); setSource('live'); setNote(String((out&&out.note)||'')); setPhase('review');
    }catch(e){
      const code=e&&e.code;
      if(code==='cancelled'){ setPhase('idle'); return; }
      if(HIDE.includes(code)){ setSampler(s=>({...s,fn:null,images:false})); setErr(msg(lang,'Live reading is not allowed in this view. The sample sheet can still use its prepared reading.','इस व्यू में लाइव रीडिंग की अनुमति नहीं है। नमूना शीट की तैयार रीडिंग अब भी ली जा सकती है।')); setPhase('idle'); return; }
      const m=ERRS[code]||['The reading was interrupted. Try again.','रीडिंग बीच में रुक गई। फिर कोशिश करें।']; setErr(msg(lang,m[0],m[1])); setPhase('idle');
    }
  }
  function prepared(){ setErr(''); setFields(doc.fields.map(f=>{ const low=doc.low.includes(f.key); return {key:f.key,value:doc.truth[f.key]||'',conf:low?'low':'high',confirmed:!low}; })); setSource('prepared'); setNote(''); setPhase('review'); }
  const setVal=(k,v)=>setFields(fs=>fs.map(f=>f.key===k?{...f,value:v,confirmed:true}:f));
  const okField=k=>setFields(fs=>fs.map(f=>f.key===k?{...f,confirmed:true}:f));
  const applyPatch=p=>setFields(fs=>fs.map(f=>f.key in p?{...f,value:p[f.key],confirmed:true}:f));

  const vals=fields?Object.fromEntries(fields.map(f=>[f.key,f.value])):{};
  const checks=fields?runChecks(type,vals,st,lang):[];
  const unconfirmed=fields?fields.some(f=>!f.confirmed):false;
  const hasErr=checks.some(c=>c.level==='err');
  function save(){ const r=commit(type,vals,st,source); setSt(r.n); setSaved(r); setPhase('saved'); toast(t.saved); }

  const counts=[['lots',Object.keys(st.lots).length],['shades',Object.keys(st.shades).length],['batches',Object.keys(st.batches).length],['dispatches',Object.keys(st.dispatches).length]];

  return (
    <div>
      <div className="head">
        <div><h1>{msg(lang,'Photograph the paper. The record builds itself.','कागज़ की फोटो लें। रिकॉर्ड अपने आप बनता है।')}</h1>
          <p>{msg(lang,'Five sheets your people already fill in, in the order material moves through the plant. Nobody types, nobody scans a barcode.','पाँच शीट जो आपके लोग पहले से भरते हैं, उसी क्रम में जैसे माल प्लांट में चलता है। न टाइपिंग, न बारकोड।')}</p></div>
        <div style={{display:'flex',alignItems:'center',gap:8}}><span className="dim" style={{fontSize:13}}>{t.lang}</span>
          <div className="seg" role="group" aria-label="Screen language">
            <button aria-pressed={lang==='en'} onClick={()=>setLang('en')}>English</button>
            <button aria-pressed={lang==='hi'} onClick={()=>setLang('hi')}>हिंदी</button></div></div>
      </div>

      <div className="steps">
        {ORDER.map((k,i)=><button key={k} className="step" aria-pressed={type===k} onClick={()=>clear(k)}>
          <span className="n">{i+1}</span><span style={{minWidth:0}}><b>{t.docs[k]}</b><small>{t.who[k]}</small></span></button>)}
      </div>

      <div className="split">
        <div className="card">
          <div className="card-h"><div><div className="eyebrow">{t.filledBy}: {t.who[type]}</div><h2>{t.docs[type]}</h2></div>
            <span className="tag">{photo?t.yourPhoto:t.sampleSheet}</span></div>
          <div className="docframe">{photo?<img src={photo.url} alt={t.yourPhoto}/>:<canvas ref={cvRef} role="img" aria-label={`${doc.en}, sample sheet`}/>}</div>
          {(live||photo)&&<div className="card-f">
            {live&&<button className="btn btn-s" onClick={()=>fileRef.current&&fileRef.current.click()} disabled={phase==='reading'}>{t.upload}</button>}
            {photo&&<button className="lnk" onClick={()=>clear()}>{t.backSample}</button>}
            <input ref={fileRef} id="photo-input" type="file" accept={(sampler.types&&sampler.types.length?sampler.types:['image/jpeg','image/png','image/webp']).join(',')} hidden onChange={pickPhoto}/>
          </div>}
        </div>

        <div className="card">
          {phase==='idle'&&<>
            <div className="card-h"><h2>{t.whatHappens}</h2></div>
            <div className="card-b stack">
              <ul className="points">
                <li><span className="k">01</span><span>{live?t.p1Live:t.p1Prep}</span></li>
                <li><span className="k">02</span><span>{t.p2}</span></li>
                <li><span className="k">03</span><span>{t.p3}</span></li>
              </ul>
              {err&&<div className="errbox" role="alert">{err}</div>}
              <div style={{display:'flex',flexWrap:'wrap',gap:10,alignItems:'center'}}>
                {live&&<button className="btn btn-p" onClick={readLive}>{t.read}</button>}
                {!photo&&(live?<button className="lnk" onClick={prepared}>{t.usePrepared}</button>:<button className="btn btn-p" onClick={prepared}>{t.prepared}</button>)}
              </div>
              <div className={'status'+(live?' on':'')}>{!sampler.ready?t.liveChecking+'…':(live?t.liveOn:t.liveOff)}</div>
            </div></>}

          {phase==='reading'&&<>
            <div className="card-h"><h2>{t.whatRead}</h2></div>
            <div className="card-b stack" aria-live="polite">
              <div style={{display:'flex',gap:10,alignItems:'center'}}><span className="spin" aria-hidden="true"></span><b>{t.reading}…</b></div>
              <div className="dim" style={{fontSize:13.5}}>{t.readingNote}</div>
              <div><button className="btn btn-s" onClick={()=>ctlRef.current&&ctlRef.current.abort()}>{t.stop}</button></div>

function suspectFor(st,b){ if(!b) return null; const col=b.lots.find(l=>{ const lot=st.lots[l.lot]; return lot&&lot.comp!=='carrier'&&lot.comp!=='PE wax'; }); return (col||b.lots[0]||{}).lot||null; }

  const d=st.dispatches[dn]; const b=d&&st.batches[d.batch];
  useEffect(()=>{ setLot(suspectFor(st,b)); },[dn]);

  const hitB=lot?Object.values(st.batches).filter(x=>x.lots.some(l=>l.lot===lot)).sort((a,b2)=>dkey(a.date)-dkey(b2.date)):[];
  const rows=[]; hitB.forEach(x=>{ const ds=Object.values(st.dispatches).filter(y=>y.batch===x.id); if(ds.length) ds.forEach(y=>rows.push({b:x,d:y})); else rows.push({b:x,d:null}); });
  const custs=new Set(rows.filter(r=>r.d).map(r=>r.d.customer)); const kgOut=rows.reduce((a,r)=>a+(r.d?r.d.qty:0),0);
  const flags=hitB.filter(x=>x.qc&&(!/^pass/i.test(x.qc.dispersion)||x.qc.de>0.9)&&(!b||x.id!==b.id));
  return (<div>
    <div className="head"><div><h1>Trace a dispatch</h1><p>A customer rejects a load. Pick the dispatch, see exactly what went into it, then choose the lot you suspect. The recall list is only the dispatches that share that lot.</p></div></div>
    <div className="split l">
      <div className="card"><div className="card-b" style={{paddingBottom:10}}><label className="eyebrow" htmlFor="dn-q">Search dispatches</label>

          <div className="card-b"><div className="gen">

            {b?<div className="node"><div className="lbl">From batch</div><div className="mono">{b.id}</div>
              <div className="dim" style={{fontSize:13}}>{b.line} · {fdate(b.date)} · {b.qc?`ΔE ${b.qc.de}, dispersion: ${b.qc.dispersion}`:'no QC reading on record'}</div></div>

            {b&&<div className="node hot"><div className="lbl">Made from these lots · pick the one you suspect</div>
              <div className="lotbtns">{b.lots.map(l=>{ const x=st.lots[l.lot]; return <button key={l.lot} className="lotbtn" aria-pressed={lot===l.lot} onClick={()=>setLot(l.lot)}>
                <span><span className="mono">{l.lot}</span><span className="dim"> · {x?x.material:'not in register'}</span></span><span className="mono dim">{kgs(l.kg)} kg</span></button>; })}</div></div>}

        </div>}
      </div>}
    </div></div>);
}

      <tbody>{lots.map(l=>{ const u=usedOf(st,l.id); const pct=l.qty?Math.min(100,u/l.qty*100):0; const used=bs.filter(b=>b.lots.some(x=>x.lot===l.id)); const isOpen=open===l.id; return (<React.Fragment key={l.id}>

      <div className="bar-in">
        <div className="brand">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 21H2Z" fill="none" stroke="var(--accent)" strokeWidth="1.6"/><path d="M12 9.5 17 21H7Z" fill="var(--accent)" opacity=".3"/></svg>
          <h1 style={{fontSize:17}}>Shade Ledger<small>by ARQ ONE AI Labs</small></h1>
        </div>
        <div className="who">
          <span>Demo prepared for <b style={{color:'var(--ink)'}}>Welset Plast Extrusions</b></span>
          <span className="pill">Sample data</span>
          {askReset?<span style={{display:'inline-flex',gap:6,alignItems:'center'}}><span>Clear everything captured?</span>
              <button className="btn btn-s" onClick={doReset}>Reset</button><button className="btn btn-s" onClick={()=>setAskReset(false)}>Cancel</button></span>
            :<button className="btn btn-s" onClick={()=>setAskReset(true)}>Reset demo</button>}
        </div>
      </div>
      <nav className="tabs" role="tablist">{TABS.map(([k,l])=><button key={k} className="tab" role="tab" aria-selected={tab===k} onClick={()=>{setTab(k);setFocus(null);}}>{l}</button>)}</nav>
    </div>
    <main className="wrap">
      {tab==='capture'&&<Capture key={gen} st={st} setSt={setSt} go={go} sampler={sampler} setSampler={setSampler} lang={lang} setLang={setLang} toast={toast}/>}
      {tab==='shades'&&<Shades st={st} focus={focus}/>}
      {tab==='trace'&&<Trace st={st} focus={focus}/>}
      {tab==='certs'&&<Certs st={st} focus={focus}/>}
      {tab==='material'&&<Material st={st} focus={focus}/>}
    </main>
    <div className="foot">Working demo. Customers, suppliers, lots and readings are sample data invented for this demonstration. Photo reading uses Claude; every check, total and certificate value is plain arithmetic on the confirmed record.</div>
    {toastMsg&&<div className="toast" role="status">{toastMsg}</div>}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
